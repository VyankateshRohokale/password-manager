# Optional local PostgreSQL. Reads DB_USERNAME and DB_PASSWORD from .env.
# Creates both the application database and the test database.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-vault_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: vault
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vault-data:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vault_app} -d vault"]
      interval: 5s
      retries: 10

volumes:
  vault-data:
