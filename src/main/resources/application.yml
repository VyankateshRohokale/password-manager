spring:
  application:
    name: vault
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vault}}
    username: ${DB_USERNAME:vault_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8787}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        name: VAULT_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}

vault:
  prelogin-secret: ${VAULT_PRELOGIN_SECRET:}
  cookie-secure: ${COOKIE_SECURE:true}
  kdf:
    min-iterations: 600000
    max-iterations: 5000000
    default-iterations: 600000
  login:
    max-failures-per-account: 10
    max-failures-per-ip: 30
    window: 15m
  credentials:
    max-per-user: 5000
    stale-after-days: 180

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
